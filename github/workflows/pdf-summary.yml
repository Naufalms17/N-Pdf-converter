name: Summarize PDFs with OpenAI
on:
  push:
    paths:
      - '**/*.pdf'
  workflow_dispatch:
    inputs:
      pdf_path:
        description: 'Optional PDF path to summarize'
        required: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils jq

      - name: Determine PDFs
        id: pdfs
        run: |
          # If manually triggered with a pdf_path input, use it. Otherwise list changed PDFs in the push.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pdf_path }}" ]; then
            echo "list=${{ github.event.inputs.pdf_path }}" >> $GITHUB_OUTPUT
          else
            if [ -n "${{ github.event.before }}" ]; then
              files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '\.pdf$' || true)
            else
              files=$(git ls-files '*.pdf' || true)
            fi
            echo "list=$files" >> $GITHUB_OUTPUT
          fi

      - name: Summarize PDFs and open issue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files="${{ steps.pdfs.outputs.list }}"
          if [ -z "$files" ]; then
            echo "No PDFs to process"
            exit 0
          fi
          IFS=$'\n' read -r -a arr <<< "$files" || true
          for pdf in "${arr[@]}"; do
            pdf=$(echo "$pdf" | xargs)
            if [ -z "$pdf" ] || [ ! -f "$pdf" ]; then
              echo "Skipping missing $pdf"
              continue
            fi
            echo "Processing $pdf"
            # extract text (limit length to keep token usage reasonable)
            text=$(pdftotext "$pdf" - 2>/dev/null | tr -d '\r' | sed 's/[^[:print:]\t\n]/ /g' | head -c 30000)
            prompt="You are a helpful assistant. Provide a concise summary (max 200 words) and 3 bullet-point key takeaways for the following PDF text:\n\n$text"

            request_body=$(jq -nc --arg m "gpt-3.5-turbo" --arg p "$prompt" '{"model":$m,"messages":[{"role":"user","content":$p}],"max_tokens":800}')
            response=$(curl -s -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" -d "$request_body" https://api.openai.com/v1/chat/completions)
            summary=$(echo "$response" | jq -r '.choices[0].message.content // .choices[0].text // "No summary returned"')

            title="PDF summary: $(basename "$pdf")"
            issue_body="**Summary generated by OpenAI**\n\nFile: $pdf\n\n$summary"
            issue_data=$(jq -nc --arg t "$title" --arg b "$issue_body" '{"title":$t,"body":$b}')

            created=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$issue_data" "https://api.github.com/repos/$REPO/issues")
            echo "Created issue: $(echo "$created" | jq -r '.html_url // "(no url)"')"
          done
